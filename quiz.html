<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本史 QUIZ</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#080b12;
  --panel:#101621;
  --panel2:#141c29;
  --line:#263246;
  --text:#e8eef7;
  --sub:#91a0b7;
  --cyan:#52e0e0;
  --blue:#5ca8ff;
  --purple:#a982ff;
  --green:#62df9b;
  --red:#ff6f7d;
  --orange:#ffb45c;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 0%,rgba(82,224,224,.08),transparent 30%),
    radial-gradient(circle at 85% 10%,rgba(169,130,255,.08),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:
    -apple-system,BlinkMacSystemFont,
    "Noto Sans JP","Yu Gothic",sans-serif;
}

button,
select{
  font:inherit;
}

.header{
  position:sticky;
  top:0;
  z-index:50;
  backdrop-filter:blur(16px);
  background:rgba(8,11,18,.88);
  border-bottom:1px solid var(--line);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:18px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:.08em;
  color:var(--cyan);
}

.logo span{
  color:#fff;
}

.nav{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.nav a{
  color:var(--sub);
  text-decoration:none;
  padding:8px 11px;
  border-radius:8px;
  transition:.2s;
}

.nav a:hover{
  color:#fff;
  background:var(--panel2);
}

.nav a.active{
  color:var(--cyan);
  background:rgba(82,224,224,.1);
}

.hero{
  max-width:1000px;
  margin:auto;
  padding:55px 24px 30px;
  text-align:center;
}

.eyebrow{
  color:var(--cyan);
  font-size:13px;
  font-weight:900;
  letter-spacing:.16em;
  margin-bottom:12px;
}

h1{
  font-size:clamp(34px,6vw,58px);
  line-height:1.1;
  margin-bottom:16px;
}

.hero p{
  color:var(--sub);
  line-height:1.8;
}


/* =========================
   CONTROL
========================= */

.controls{
  max-width:900px;
  margin:auto;
  padding:0 24px 25px;
}

.control-box{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
}

.control-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

select{
  width:100%;
  padding:13px 14px;
  color:#fff;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:9px;
  outline:none;
}

select:focus{
  border-color:var(--cyan);
}

.start-button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:linear-gradient(
    135deg,
    var(--cyan),
    var(--blue)
  );
  color:#061018;
  font-weight:900;
  cursor:pointer;
  transition:.2s;
}

.start-button:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}


/* =========================
   MAIN
========================= */

.main{
  max-width:900px;
  margin:auto;
  padding:0 24px 70px;
}


/* =========================
   QUIZ HEADER
========================= */

.quiz-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:10px;
}

.progress-text{
  color:var(--sub);
  font-size:14px;
}

.score-text{
  color:var(--cyan);
  font-weight:900;
}

.progress-bar{
  width:100%;
  height:7px;
  background:var(--panel2);
  border-radius:999px;
  overflow:hidden;
  margin-bottom:20px;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(
    90deg,
    var(--cyan),
    var(--blue)
  );
  transition:.3s;
}


/* =========================
   QUESTION CARD
========================= */

.quiz-card{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.025),
      transparent
    ),
    var(--panel);

  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
}

.question-area{
  padding:30px;
}

.question-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:18px;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.025);
  color:var(--sub);
  font-size:12px;
}

.badge.category{
  color:var(--cyan);
  border-color:rgba(82,224,224,.3);
}

.badge.period{
  color:var(--blue);
  border-color:rgba(92,168,255,.3);
}

.question{
  font-size:clamp(22px,4vw,31px);
  font-weight:900;
  line-height:1.6;
}

.options{
  display:grid;
  gap:11px;
  margin-top:28px;
}

.option{
  width:100%;
  padding:17px 18px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:#dfe7f2;
  border-radius:11px;
  text-align:left;
  cursor:pointer;
  transition:.2s;
}

.option:hover:not(:disabled){
  border-color:var(--cyan);
  background:rgba(82,224,224,.06);
  transform:translateX(2px);
}

.option:disabled{
  cursor:default;
}

.option.correct{
  border-color:var(--green);
  background:rgba(98,223,155,.1);
  color:#dffff0;
}

.option.wrong{
  border-color:var(--red);
  background:rgba(255,111,125,.1);
  color:#ffe4e7;
}

.option-letter{
  display:inline-flex;
  width:28px;
  height:28px;
  justify-content:center;
  align-items:center;
  margin-right:9px;
  border:1px solid #364359;
  border-radius:7px;
  color:var(--cyan);
  font-size:13px;
  font-weight:900;
}

.option.correct .option-letter{
  color:var(--green);
  border-color:var(--green);
}

.option.wrong .option-letter{
  color:var(--red);
  border-color:var(--red);
}


/* =========================
   EXPLANATION
========================= */

.explanation{
  display:none;
  padding:22px 30px;
  border-top:1px solid var(--line);
  background:rgba(0,0,0,.14);
}

.explanation.show{
  display:block;
}

.explanation-label{
  color:var(--cyan);
  font-size:12px;
  font-weight:900;
  letter-spacing:.1em;
  margin-bottom:8px;
}

.explanation-text{
  color:#c7d1df;
  line-height:1.9;
}


/* =========================
   NEXT
========================= */

.next-area{
  display:none;
  padding:18px 30px 24px;
}

.next-area.show{
  display:block;
}

.next-button{
  width:100%;
  padding:14px;
  border:1px solid var(--cyan);
  border-radius:10px;
  background:rgba(82,224,224,.08);
  color:var(--cyan);
  font-weight:900;
  cursor:pointer;
  transition:.2s;
}

.next-button:hover{
  background:rgba(82,224,224,.15);
}


/* =========================
   RESULT
========================= */

.result{
  display:none;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:40px 30px;
  text-align:center;
}

.result.show{
  display:block;
}

.result-title{
  color:var(--cyan);
  font-size:14px;
  font-weight:900;
  letter-spacing:.15em;
  margin-bottom:12px;
}

.result-score{
  font-size:64px;
  font-weight:900;
  line-height:1;
  margin-bottom:15px;
}

.result-message{
  color:var(--sub);
  line-height:1.8;
  margin-bottom:25px;
}

.result-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:20px;
}

.result-stat{
  padding:15px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel2);
}

.result-stat strong{
  display:block;
  font-size:22px;
  color:#fff;
  margin-bottom:4px;
}

.result-stat span{
  font-size:11px;
  color:var(--sub);
}

.retry-button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:linear-gradient(
    135deg,
    var(--cyan),
    var(--blue)
  );
  color:#061018;
  font-weight:900;
  cursor:pointer;
}


/* =========================
   FOOTER
========================= */

.footer{
  border-top:1px solid var(--line);
  color:var(--sub);
  text-align:center;
  padding:30px 20px;
  font-size:12px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .header-inner{
    flex-direction:column;
    align-items:flex-start;
  }

  .hero{
    text-align:left;
  }

  .control-row{
    grid-template-columns:1fr;
  }

}

@media(max-width:550px){

  .hero,
  .controls,
  .main{
    padding-left:15px;
    padding-right:15px;
  }

  .question-area{
    padding:21px;
  }

  .question{
    font-size:21px;
  }

  .explanation{
    padding:20px;
  }

  .next-area{
    padding:16px 20px 20px;
  }

  .result{
    padding:30px 20px;
  }

  .result-stats{
    grid-template-columns:1fr;
  }

}
</style>
</head>

/* =========================================================
   STATE
========================================================= */

let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;


/* =========================================================
   FILTER
========================================================= */

function initFilters(){

  const periodFilter =
    document.getElementById("periodFilter");

  const categoryFilter =
    document.getElementById("categoryFilter");

  const periods =
    [...new Set(
      quizData.map(item => item.period)
    )];

  const categories =
    [...new Set(
      quizData.map(item => item.category)
    )];


  periods.forEach(period => {

    const option =
      document.createElement("option");

    option.value = period;
    option.textContent = period;

    periodFilter.appendChild(option);

  });


  categories.forEach(category => {

    const option =
      document.createElement("option");

    option.value = category;
    option.textContent = category;

    categoryFilter.appendChild(option);

  });

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

  const copy = [...array];

  for(let i=copy.length-1;i>0;i--){

    const j =
      Math.floor(Math.random()*(i+1));

    [copy[i],copy[j]] =
      [copy[j],copy[i]];

  }

  return copy;

}


/* =========================================================
   START
========================================================= */

function startQuiz(){

  const period =
    document.getElementById("periodFilter").value;

  const category =
    document.getElementById("categoryFilter").value;


  let filtered =
    quizData.filter(item => {

      if(period && item.period !== period){
        return false;
      }

      if(category && item.category !== category){
        return false;
      }

      return true;

    });


  if(filtered.length === 0){
    alert("条件に一致する問題がありません。");
    return;
  }


  currentQuestions =
    shuffle(filtered).slice(
      0,
      Math.min(10,filtered.length)
    );


  currentIndex = 0;
  score = 0;
  answered = false;


  document.getElementById("scoreText")
    .textContent = "正解 0";

  document.getElementById("result")
    .classList.remove("show");

  document.getElementById("quizCard")
    .style.display = "block";


  renderQuestion();

}


/* =========================================================
   RENDER QUESTION
========================================================= */

function renderQuestion(){

  const item =
    currentQuestions[currentIndex];

  answered = false;


  document.getElementById("progressText")
    .textContent =
      `問題 ${currentIndex + 1} / ${currentQuestions.length}`;


  document.getElementById("progressFill")
    .style.width =
      `${(currentIndex / currentQuestions.length) * 100}%`;


  document.getElementById("questionMeta")
    .innerHTML = `

      <span class="badge period">
        ${item.period}
      </span>

      <span class="badge category">
        ${item.category}
      </span>

    `;


  document.getElementById("question")
    .textContent = item.question;


  const options =
    document.getElementById("options");

  options.innerHTML = "";


  item.choices.forEach((choice,index) => {

    const button =
      document.createElement("button");

    button.className = "option";

    button.innerHTML = `

      <span class="option-letter">
        ${String.fromCharCode(65 + index)}
      </span>

      ${choice}

    `;


    button.addEventListener(
      "click",
      () => answerQuestion(index)
    );


    options.appendChild(button);

  });


  document.getElementById("explanation")
    .classList.remove("show");

  document.getElementById("nextArea")
    .classList.remove("show");

}


/* =========================================================
   ANSWER
========================================================= */

function answerQuestion(selected){

  if(answered){
    return;
  }

  answered = true;


  const item =
    currentQuestions[currentIndex];

  const buttons =
    [...document.querySelectorAll(".option")];


  buttons.forEach((button,index) => {

    button.disabled = true;


    if(index === item.answer){
      button.classList.add("correct");
    }


    if(
      index === selected &&
      selected !== item.answer
    ){
      button.classList.add("wrong");
    }

  });


  if(selected === item.answer){

    score++;

    document.getElementById("scoreText")
      .textContent =
        `正解 ${score}`;

  }


  document.getElementById("explanationText")
    .textContent = item.explanation;


  document.getElementById("explanation")
    .classList.add("show");


  document.getElementById("nextArea")
    .classList.add("show");

}


/* =========================================================
   NEXT
========================================================= */

function nextQuestion(){

  currentIndex++;


  if(currentIndex >= currentQuestions.length){

    finishQuiz();

    return;

  }


  renderQuestion();

}


/* =========================================================
   RESULT
========================================================= */

function finishQuiz(){

  const total =
    currentQuestions.length;

  const percentage =
    Math.round((score / total) * 100);


  document.getElementById("quizCard")
    .style.display = "none";


  document.getElementById("progressText")
    .textContent = "終了";


  document.getElementById("progressFill")
    .style.width = "100%";


  document.getElementById("resultScore")
    .textContent =
      `${percentage}%`;


  document.getElementById("correctResult")
    .textContent = score;


  document.getElementById("wrongResult")
    .textContent =
      total - score;


  document.getElementById("totalResult")
    .textContent = total;


  let message = "";


  if(percentage === 100){

    message =
      "完璧！このレベルを維持しよう。";

  }else if(percentage >= 80){

    message =
      "かなりいい感じ。細かい知識を固めればさらに強くなる。";

  }else if(percentage >= 60){

    message =
      "基本は身についてきている。間違えた問題をもう一度確認しよう。";

  }else{

    message =
      "ここから伸ばせる！間違えた問題を復習して再挑戦しよう。";

  }


  document.getElementById("resultMessage")
    .textContent = message;


  document.getElementById("result")
    .classList.add("show");

}


/* =========================================================
   RETRY
========================================================= */

function retryQuiz(){

  document.getElementById("result")
    .classList.remove("show");

  startQuiz();

}


/* =========================================================
   EVENTS
========================================================= */

document
  .getElementById("startButton")
  .addEventListener(
    "click",
    startQuiz
  );


document
  .getElementById("nextButton")
  .addEventListener(
    "click",
    nextQuestion
  );


document
  .getElementById("retryButton")
  .addEventListener(
    "click",
    retryQuiz
  );


/* =========================================================
   START
========================================================= */

initFilters();

</script>
