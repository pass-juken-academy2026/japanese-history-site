<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本史 CONNECTIONS</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#080b12;
  --panel:#101621;
  --panel2:#141c29;
  --line:#263246;
  --text:#e8eef7;
  --sub:#91a0b7;
  --blue:#5ca8ff;
  --cyan:#52e0e0;
  --purple:#a982ff;
  --green:#62df9b;
  --orange:#ffb45c;
  --red:#ff6f7d;
}

body{
  background:
    radial-gradient(circle at 20% 0%,rgba(82,224,224,.08),transparent 30%),
    radial-gradient(circle at 80% 10%,rgba(169,130,255,.08),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:
    -apple-system,BlinkMacSystemFont,
    "Noto Sans JP","Yu Gothic",sans-serif;
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

.header{
  position:sticky;
  top:0;
  z-index:50;
  backdrop-filter:blur(16px);
  background:rgba(8,11,18,.88);
  border-bottom:1px solid var(--line);
}

.header-inner{
  max-width:1400px;
  margin:auto;
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.logo{
  font-weight:900;
  letter-spacing:.08em;
  color:var(--cyan);
  font-size:20px;
}

.logo span{
  color:#fff;
}

.nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.nav a{
  color:var(--sub);
  text-decoration:none;
  padding:8px 12px;
  border-radius:8px;
  transition:.2s;
}

.nav a:hover{
  color:#fff;
  background:var(--panel2);
}

.nav a.active{
  color:var(--cyan);
  background:rgba(82,224,224,.1);
}

.hero{
  max-width:1400px;
  margin:auto;
  padding:55px 24px 30px;
}

.eyebrow{
  color:var(--cyan);
  font-size:13px;
  font-weight:800;
  letter-spacing:.16em;
  margin-bottom:12px;
}

h1{
  font-size:clamp(32px,5vw,58px);
  line-height:1.1;
  margin-bottom:16px;
}

.hero p{
  color:var(--sub);
  max-width:800px;
  line-height:1.8;
}

.controls{
  max-width:1400px;
  margin:auto;
  padding:0 24px 28px;
}

.search{
  width:100%;
  padding:16px 18px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  color:#fff;
  outline:none;
  margin-bottom:14px;
}

.search:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(82,224,224,.08);
}

.filters{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

select{
  padding:13px 14px;
  background:var(--panel);
  border:1px solid var(--line);
  color:#fff;
  border-radius:10px;
  outline:none;
}

.stats{
  max-width:1400px;
  margin:auto;
  padding:0 24px 25px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.stat{
  background:var(--panel);
  border:1px solid var(--line);
  padding:12px 16px;
  border-radius:10px;
  color:var(--sub);
}

.stat strong{
  color:#fff;
  margin-right:5px;
}

.main{
  max-width:1400px;
  margin:auto;
  padding:0 24px 70px;
}

/* CONNECTION */
.connection-list{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.connection{
  position:relative;
  background:
    linear-gradient(135deg,rgba(255,255,255,.025),transparent),
    var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  transition:.25s;
}

.connection:hover{
  transform:translateY(-2px);
  border-color:#3b4d68;
  box-shadow:0 12px 35px rgba(0,0,0,.22);
}

.connection-main{
  padding:24px;
}

.connection-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}

.number{
  color:var(--cyan);
  font-size:13px;
  font-weight:900;
  letter-spacing:.1em;
}

.title{
  font-size:23px;
  font-weight:900;
  margin-top:7px;
}

.description{
  color:var(--sub);
  line-height:1.8;
  margin-top:12px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:15px;
}

.badge{
  font-size:12px;
  padding:5px 9px;
  border-radius:999px;
  border:1px solid var(--line);
  color:var(--sub);
  background:rgba(255,255,255,.025);
}

.badge.cause{
  color:var(--orange);
  border-color:rgba(255,180,92,.3);
}

.badge.result{
  color:var(--green);
  border-color:rgba(98,223,155,.3);
}

.badge.people{
  color:var(--purple);
  border-color:rgba(169,130,255,.3);
}

.badge.period{
  color:var(--blue);
  border-color:rgba(92,168,255,.3);
}

.flow{
  margin-top:22px;
  display:grid;
  grid-template-columns:1fr 70px 1fr;
  align-items:stretch;
  gap:12px;
}

.node{
  background:var(--panel2);
  border:1px solid #2b374b;
  border-radius:12px;
  padding:17px;
}

.node-label{
  color:var(--sub);
  font-size:11px;
  font-weight:800;
  letter-spacing:.1em;
  margin-bottom:7px;
}

.node h3{
  font-size:17px;
  margin-bottom:7px;
}

.node p{
  color:var(--sub);
  font-size:13px;
  line-height:1.7;
}

.arrow{
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--cyan);
  font-size:28px;
}

.details{
  border-top:1px solid var(--line);
  padding:18px 24px;
  background:rgba(0,0,0,.12);
}

.details-title{
  font-size:12px;
  font-weight:900;
  color:var(--cyan);
  letter-spacing:.08em;
  margin-bottom:8px;
}

.details p{
  color:#c4cfdd;
  line-height:1.8;
  font-size:14px;
}

.empty{
  padding:70px 20px;
  text-align:center;
  color:var(--sub);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
}

.footer{
  border-top:1px solid var(--line);
  color:var(--sub);
  text-align:center;
  padding:30px 20px;
  font-size:12px;
}

@media(max-width:800px){
  .header-inner{
    flex-direction:column;
    align-items:flex-start;
  }

  .filters{
    grid-template-columns:1fr 1fr;
  }

  .flow{
    grid-template-columns:1fr;
  }

  .arrow{
    transform:rotate(90deg);
    height:25px;
  }

  .connection-top{
    flex-direction:column;
  }
}

@media(max-width:500px){
  .hero,
  .controls,
  .stats,
  .main{
    padding-left:15px;
    padding-right:15px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .title{
    font-size:20px;
  }

  .connection-main{
    padding:18px;
  }
}
</style>
</head>

/* =========================================================
   HTML安全化
========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   FILTER INITIALIZE
========================================================= */

function initFilters(){

  const periodFilter =
    document.getElementById("periodFilter");

  const typeFilter =
    document.getElementById("typeFilter");

  const periods =
    [...new Set(connectionData.map(item => item.period))];

  const types =
    [...new Set(connectionData.map(item => item.type))];

  periods.forEach(period => {

    const option = document.createElement("option");

    option.value = period;
    option.textContent = period;

    periodFilter.appendChild(option);

  });

  types.forEach(type => {

    const option = document.createElement("option");

    option.value = type;
    option.textContent = type;

    typeFilter.appendChild(option);

  });

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const list =
    document.getElementById("connectionList");

  const search =
    document.getElementById("search")
      .value
      .trim()
      .toLowerCase();

  const period =
    document.getElementById("periodFilter").value;

  const type =
    document.getElementById("typeFilter").value;

  const importance =
    document.getElementById("importanceFilter").value;

  const direction =
    document.getElementById("directionFilter").value;


  const filtered =
    connectionData.filter(item => {

      const targetText = [
        item.title,
        item.description,
        item.fromTitle,
        item.fromText,
        item.toTitle,
        item.toText,
        item.detail,
        item.people,
        item.period,
        item.type,
        ...item.tags
      ].join(" ").toLowerCase();


      if(search && !targetText.includes(search)){
        return false;
      }

      if(period && item.period !== period){
        return false;
      }

      if(type && item.type !== type){
        return false;
      }

      if(
        importance &&
        String(item.importance) !== importance
      ){
        return false;
      }

      if(direction && item.direction !== direction){
        return false;
      }

      return true;

    });


  document.getElementById("displayCount")
    .textContent = filtered.length;

  document.getElementById("totalCount")
    .textContent = connectionData.length;


  if(filtered.length === 0){

    list.innerHTML = `
      <div class="empty">
        条件に一致するつながりがありません。
      </div>
    `;

    return;

  }


  list.innerHTML =
    filtered.map((item,index) => {

      const stars =
        "★".repeat(item.importance) +
        "☆".repeat(3-item.importance);


      return `

        <article class="connection">

          <div class="connection-main">

            <div class="connection-top">

              <div>

                <div class="number">
                  CONNECTION ${String(index+1).padStart(2,"0")}
                </div>

                <div class="title">
                  ${escapeHTML(item.title)}
                </div>

              </div>

            </div>


            <p class="description">
              ${escapeHTML(item.description)}
            </p>


            <div class="badges">

              <span class="badge period">
                ${escapeHTML(item.period)}
              </span>

              <span class="badge">
                ${escapeHTML(item.type)}
              </span>

              <span class="badge cause">
                ${stars}
              </span>

              <span class="badge people">
                ${escapeHTML(item.people)}
              </span>

              ${
                item.tags.map(tag => `
                  <span class="badge">
                    #${escapeHTML(tag)}
                  </span>
                `).join("")
              }

            </div>


            <div class="flow">

              <div class="node">

                <div class="node-label">
                  FROM / 背景・原因
                </div>

                <h3>
                  ${escapeHTML(item.fromTitle)}
                </h3>

                <p>
                  ${escapeHTML(item.fromText)}
                </p>

              </div>


              <div class="arrow">
                →
              </div>


              <div class="node">

                <div class="node-label">
                  TO / 結果・変化
                </div>

                <h3>
                  ${escapeHTML(item.toTitle)}
                </h3>

                <p>
                  ${escapeHTML(item.toText)}
                </p>

              </div>

            </div>

          </div>


          <div class="details">

            <div class="details-title">
              WHY IT MATTERS
            </div>

            <p>
              ${escapeHTML(item.detail)}
            </p>

          </div>

        </article>

      `;

    }).join("");

}


/* =========================================================
   EVENTS
========================================================= */

document
  .getElementById("search")
  .addEventListener("input",render);

document
  .getElementById("periodFilter")
  .addEventListener("change",render);

document
  .getElementById("typeFilter")
  .addEventListener("change",render);

document
  .getElementById("importanceFilter")
  .addEventListener("change",render);

document
  .getElementById("directionFilter")
  .addEventListener("change",render);


/* =========================================================
   START
========================================================= */

initFilters();
render();

</script>

</body>
</html>
