<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本史 MOCK EXAM</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#080b12;
  --panel:#101621;
  --panel2:#141c29;
  --line:#263246;
  --text:#e8eef7;
  --sub:#91a0b7;
  --cyan:#52e0e0;
  --blue:#5ca8ff;
  --purple:#a982ff;
  --green:#62df9b;
  --orange:#ffb45c;
  --red:#ff6f7d;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 0%,rgba(82,224,224,.08),transparent 30%),
    radial-gradient(circle at 90% 10%,rgba(169,130,255,.08),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;
}

button,
select{
  font:inherit;
}


/* =========================
   HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(8,11,18,.9);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
}

.header-inner{
  max-width:1150px;
  margin:auto;
  padding:17px 22px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.logo{
  color:var(--cyan);
  font-weight:900;
  font-size:19px;
  letter-spacing:.08em;
}

.logo span{
  color:#fff;
}

.nav{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.nav a{
  color:var(--sub);
  text-decoration:none;
  padding:8px 10px;
  border-radius:8px;
}

.nav a:hover{
  color:#fff;
  background:var(--panel2);
}

.nav a.active{
  color:var(--cyan);
  background:rgba(82,224,224,.1);
}


/* =========================
   HERO
========================= */

.hero{
  max-width:1050px;
  margin:auto;
  padding:50px 22px 30px;
}

.eyebrow{
  color:var(--cyan);
  font-size:12px;
  font-weight:900;
  letter-spacing:.18em;
  margin-bottom:12px;
}

h1{
  font-size:clamp(32px,6vw,56px);
  line-height:1.1;
  margin-bottom:14px;
}

.hero p{
  color:var(--sub);
  line-height:1.8;
}


/* =========================
   SETUP
========================= */

.setup{
  max-width:1050px;
  margin:auto;
  padding:0 22px 30px;
}

.setup-box{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:22px;
}

.setup-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:16px;
}

select{
  width:100%;
  padding:13px;
  color:#fff;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:9px;
  outline:none;
}

select:focus{
  border-color:var(--cyan);
}

.start-btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:15px;
  cursor:pointer;

  color:#071014;
  background:var(--cyan);

  font-weight:900;
  transition:.2s;
}

.start-btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}


/* =========================
   EXAM
========================= */

.exam{
  display:none;
  max-width:900px;
  margin:auto;
  padding:0 22px 70px;
}

.exam.show{
  display:block;
}


/* =========================
   TOP BAR
========================= */

.exam-top{
  position:sticky;
  top:75px;
  z-index:30;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;

  padding:13px 16px;
  margin-bottom:18px;

  background:rgba(16,22,33,.95);
  backdrop-filter:blur(12px);

  border:1px solid var(--line);
  border-radius:11px;
}

.progress-area{
  flex:1;
}

.progress-text{
  color:var(--sub);
  font-size:12px;
  margin-bottom:6px;
}

.progress{
  height:5px;
  overflow:hidden;
  border-radius:999px;
  background:#1b2534;
}

.progress-bar{
  width:0%;
  height:100%;
  background:var(--cyan);
  transition:.25s;
}

.timer{
  min-width:85px;
  text-align:center;
  padding:9px 12px;

  color:var(--orange);
  background:rgba(255,180,92,.08);
  border:1px solid rgba(255,180,92,.25);
  border-radius:8px;

  font-weight:900;
}

.timer.warning{
  color:var(--red);
  border-color:rgba(255,111,125,.35);
  background:rgba(255,111,125,.08);
}


/* =========================
   QUESTION
========================= */

.question-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}

.question-head{
  padding:24px 24px 18px;
}

.question-number{
  color:var(--cyan);
  font-size:12px;
  font-weight:900;
  letter-spacing:.1em;
  margin-bottom:12px;
}

.question-category{
  display:inline-block;
  color:var(--sub);
  font-size:11px;
  padding:5px 8px;
  border:1px solid var(--line);
  border-radius:999px;
  margin-bottom:14px;
}

.question-text{
  font-size:19px;
  line-height:1.8;
  font-weight:800;
}


/* =========================
   SOURCE BOX
========================= */

.source{
  margin:0 24px 20px;
  padding:18px;

  background:#0b111a;
  border:1px solid #202d40;
  border-radius:10px;

  color:#c4cfdf;
  line-height:1.85;
  font-size:14px;
}

.source-title{
  color:var(--purple);
  font-size:11px;
  font-weight:900;
  letter-spacing:.1em;
  margin-bottom:8px;
}


/* =========================
   OPTIONS
========================= */

.options{
  padding:0 24px 24px;

  display:grid;
  gap:10px;
}

.option{
  position:relative;

  width:100%;
  padding:15px 16px;

  text-align:left;

  color:#dce5f1;
  background:var(--panel2);

  border:1px solid var(--line);
  border-radius:10px;

  cursor:pointer;
  transition:.2s;
}

.option:hover:not(:disabled){
  border-color:#48607d;
  background:#182232;
}

.option.selected{
  border-color:var(--cyan);
  background:rgba(82,224,224,.08);
}

.option.correct{
  border-color:var(--green);
  background:rgba(98,223,155,.1);
}

.option.wrong{
  border-color:var(--red);
  background:rgba(255,111,125,.1);
}

.option:disabled{
  cursor:default;
}

.option-letter{
  display:inline-flex;
  width:28px;
  height:28px;
  align-items:center;
  justify-content:center;

  margin-right:10px;

  border-radius:7px;
  background:#0b111a;
  border:1px solid var(--line);

  color:var(--sub);
  font-weight:900;
}


/* =========================
   NEXT
========================= */

.action{
  padding:0 24px 24px;
}

.next-btn{
  width:100%;
  padding:14px;

  color:#071014;
  background:var(--cyan);

  border:0;
  border-radius:9px;

  font-weight:900;
  cursor:pointer;
}

.next-btn:disabled{
  opacity:.35;
  cursor:not-allowed;
}


/* =========================
   EXPLANATION
========================= */

.explanation{
  display:none;

  margin:0 24px 20px;
  padding:18px;

  border-radius:10px;

  background:rgba(169,130,255,.06);
  border:1px solid rgba(169,130,255,.25);
}

.explanation.show{
  display:block;
}

.explanation-title{
  color:var(--purple);
  font-size:12px;
  font-weight:900;
  margin-bottom:8px;
}

.explanation-text{
  color:#cbd5e4;
  line-height:1.8;
  font-size:13px;
}


/* =========================
   RESULT
========================= */

.result{
  display:none;
  max-width:900px;
  margin:auto;
  padding:0 22px 70px;
}

.result.show{
  display:block;
}

.result-box{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:28px;
  text-align:center;
}

.result-title{
  color:var(--cyan);
  font-size:13px;
  font-weight:900;
  letter-spacing:.15em;
  margin-bottom:12px;
}

.score{
  font-size:58px;
  font-weight:900;
  margin-bottom:5px;
}

.score-sub{
  color:var(--sub);
  margin-bottom:25px;
}

.result-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:25px;
}

.result-stat{
  padding:16px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:10px;
}

.result-stat strong{
  display:block;
  font-size:24px;
  color:var(--cyan);
  margin-bottom:5px;
}

.result-stat span{
  color:var(--sub);
  font-size:11px;
}

.section-result{
  text-align:left;
  border-top:1px solid var(--line);
  padding-top:20px;
  margin-top:20px;
}

.section-result h3{
  font-size:14px;
  margin-bottom:13px;
}

.section-row{
  margin-bottom:13px;
}

.section-row-top{
  display:flex;
  justify-content:space-between;
  color:var(--sub);
  font-size:12px;
  margin-bottom:5px;
}

.section-bar{
  height:6px;
  background:#1b2534;
  border-radius:999px;
  overflow:hidden;
}

.section-fill{
  height:100%;
  background:var(--cyan);
}

.retry{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;

  color:#071014;
  background:var(--cyan);

  font-weight:900;
  cursor:pointer;

  margin-top:24px;
}


/* =========================
   FOOTER
========================= */

.footer{
  border-top:1px solid var(--line);
  color:var(--sub);
  text-align:center;
  padding:30px 20px;
  font-size:12px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:750px){

  .header-inner{
    flex-direction:column;
    align-items:flex-start;
  }

  .setup-grid{
    grid-template-columns:1fr;
  }

  .exam-top{
    top:125px;
  }

  .result-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:550px){

  .hero,
  .setup,
  .exam,
  .result{
    padding-left:14px;
    padding-right:14px;
  }

  .question-head{
    padding:20px 17px 15px;
  }

  .question-text{
    font-size:17px;
  }

  .source,
  .options,
  .action{
    margin-left:17px;
    margin-right:17px;
    padding-left:0;
    padding-right:0;
  }

  .source{
    padding:15px;
  }

  .exam-top{
    top:125px;
  }

}
</style>
</head>

<header class="header">

</section>


<footer class="footer">

========================================================= */

[

    mockData.map(q => q.period)
  )
].forEach(period => {

  const option =
    document.createElement("option");

  option.value = period;
  option.textContent = period;

  periodFilter.appendChild(option);

});


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

  const arr = [...array];

  for(
    let i = arr.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      arr[i],
      arr[j]
    ] = [
      arr[j],
      arr[i]
    ];

  }

  return arr;
}


/* =========================================================
   START
========================================================= */

function startExam(){

  const period =
    periodFilter.value;

  const count =
    Number(countSelect.value);


  let pool =
    mockData.filter(q => {

      if(
        period &&
        q.period !== period
      ){
        return false;
      }

      return true;

    });


  if(pool.length === 0){

    alert("問題がありません。");

    return;

  }


  questions =
    shuffle(pool)
      .slice(
        0,
        Math.min(
          count,
          pool.length
        )
      );


  current = 0;
  score = 0;
  results = [];
  answered = false;

  timeLeft = questions.length * 120;

  setup.style.display = "none";
  result.classList.remove("show");
  exam.classList.add("show");

  startTimer();
  renderQuestion();

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

  clearInterval(timerId);

  updateTimer();


  timerId =
    setInterval(() => {

      timeLeft--;

      updateTimer();


      if(timeLeft <= 0){

        clearInterval(timerId);

        finishExam();

      }

    },1000);

}


function updateTimer(){

  const minutes =
    Math.floor(
      timeLeft / 60
    );

  const seconds =
    timeLeft % 60;


  timer.textContent =
    `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;


  if(timeLeft <= 60){

    timer.classList.add("warning");

  }else{

    timer.classList.remove("warning");

  }

}


/* =========================================================
   RENDER QUESTION
========================================================= */

function renderQuestion(){

  const q =
    questions[current];

  answered = false;

  progressText.textContent =
    `${current + 1} / ${questions.length}`;

  progressBar.style.width =
    `${((current + 1) / questions.length) * 100}%`;


  questionNumber.textContent =
    `QUESTION ${String(current + 1).padStart(2,"0")}`;

  questionCategory.textContent =
    q.category;

  questionText.textContent =
    q.question;


  if(q.source){

    sourceBox.style.display = "block";
    sourceText.textContent = q.source;

  }else{

    sourceBox.style.display = "none";

  }


  options.innerHTML = "";


  q.options.forEach(
    (optionText,index) => {

      const button =
        document.createElement("button");

      button.className = "option";


      button.innerHTML = `
        <span class="option-letter">
          ${String.fromCharCode(65 + index)}
        </span>
        ${escapeHTML(optionText)}
      `;


      button.addEventListener(
        "click",
        () => selectOption(index)
      );


      options.appendChild(button);

    }
  );


  explanation.classList.remove("show");
  explanationText.textContent = "";

  nextBtn.disabled = true;
  nextBtn.textContent =
    current === questions.length - 1
      ? "結果を見る"
      : "次の問題";

}


/* =========================================================
   SELECT
========================================================= */

function selectOption(index){

  if(answered){
    return;
  }


  answered = true;


  const q =
    questions[current];

  const buttons =
    [...document.querySelectorAll(".option")];


  buttons.forEach(
    (button,i) => {

      button.disabled = true;

      if(i === q.answer){

        button.classList.add("correct");

      }

    }
  );


  if(index === q.answer){

    score++;

    results.push({
      correct:true,
      category:q.category
    });

  }else{

    buttons[index]
      .classList.add("wrong");

    results.push({
      correct:false,
      category:q.category
    });

  }


  explanationText.textContent =
    q.explanation;

  explanation.classList.add("show");

  nextBtn.disabled = false;
}


/* =========================================================
   NEXT
========================================================= */

function nextQuestion(){

  if(!answered){
    return;
  }


  current++;


  if(current >= questions.length){

    finishExam();

    return;

  }


  renderQuestion();

}


/* =========================================================
   FINISH
========================================================= */

function finishExam(){

  clearInterval(timerId);

  exam.classList.remove("show");
  result.classList.add("show");


  const total =
    questions.length;

  const percent =
    Math.round(
      score / total * 100
    );


  document.getElementById(
    "finalScore"
  ).textContent =
    `${percent}%`;


  document.getElementById(
    "correctCount"
  ).textContent =
    score;


  document.getElementById(
    "wrongCount"
  ).textContent =
    total - score;


  document.getElementById(
    "totalCount"
  ).textContent =
    total;


  renderSectionResults();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   SECTION RESULTS
========================================================= */

function renderSectionResults(){

  const container =
    document.getElementById(
      "sectionResults"
    );

  container.innerHTML = "";


  const categories =
    [...new Set(
      questions.map(q => q.category)
    )];


  categories.forEach(category => {

    const categoryQuestions =
      questions.filter(
        q => q.category === category
      );


    const categoryResults =
      results.filter(
        r => r.category === category
      );


    const correct =
      categoryResults.filter(
        r => r.correct
      ).length;


    const total =
      categoryQuestions.length;


    const percent =
      Math.round(
        correct / total * 100
      );


    const row =
      document.createElement("div");

    row.className =
      "section-row";


    row.innerHTML = `

      <div class="section-row-top">

        <span>
          ${escapeHTML(category)}
        </span>

        <span>
          ${correct} / ${total}
        </span>

      </div>

      <div class="section-bar">

        <div
          class="section-fill"
          style="width:${percent}%"
        ></div>

      </div>

    `;


    container.appendChild(row);

  });

}


/* =========================================================
   RETRY
========================================================= */

function retry(){

  result.classList.remove("show");
  setup.style.display = "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   EVENTS
========================================================= */

startBtn.addEventListener(
  "click",
  startExam
);

nextBtn.addEventListener(
  "click",
  nextQuestion
);

document
  .getElementById("retryBtn")
  .addEventListener(
    "click",
    retry
  );

</script>

</body>
</html>
