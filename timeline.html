<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>日本史 詳細年表</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#070a10;
  --panel:#0e1522;
  --panel2:#131d2e;
  --line:#273752;
  --text:#eef3ff;
  --muted:#96a2b8;
  --accent:#6d8cff;
  --gold:#e7bd62;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 20% 0%,rgba(75,100,180,.18),transparent 35%),
    radial-gradient(circle at 90% 10%,rgba(210,160,60,.08),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:"Noto Sans JP","Yu Gothic",system-ui,sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(7,10,16,.9);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo span{
  color:var(--gold);
}

.header-sub{
  color:var(--muted);
  font-size:13px;
}

main{
  max-width:1200px;
  margin:auto;
  padding:45px 20px 80px;
}

.hero{
  margin-bottom:28px;
}

.eyebrow{
  color:var(--gold);
  font-size:13px;
  letter-spacing:.15em;
  font-weight:800;
}

h1{
  margin:8px 0 12px;
  font-size:clamp(34px,5vw,56px);
  line-height:1.1;
}

.hero p{
  max-width:800px;
  color:var(--muted);
  line-height:1.8;
  margin:0;
}

.control-box{
  background:
    linear-gradient(145deg,rgba(17,26,42,.98),rgba(9,14,24,.98));
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin-bottom:28px;
}

.search{
  width:100%;
  padding:14px 16px;
  border-radius:11px;
  border:1px solid var(--line);
  outline:none;
  background:#080d16;
  color:#fff;
}

.search:focus{
  border-color:var(--accent);
}

.filters{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:12px;
}

select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#080d16;
  color:#dce5f8;
}

.stats{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}

.stat{
  padding:8px 12px;
  border-radius:999px;
  background:#101827;
  border:1px solid #1d2a40;
  color:var(--muted);
  font-size:13px;
}

.stat strong{
  color:#fff;
}

.timeline{
  position:relative;
}

.timeline::before{
  content:"";
  position:absolute;
  left:91px;
  top:0;
  bottom:0;
  width:2px;
  background:#304362;
}

.event{
  position:relative;
  display:grid;
  grid-template-columns:145px 1fr;
  gap:25px;
  margin-bottom:16px;
}

.year{
  text-align:right;
  padding-top:19px;
  padding-right:22px;
  color:var(--gold);
  font-size:14px;
  font-weight:800;
}

.dot{
  position:absolute;
  left:83px;
  top:22px;
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--bg);
  border:3px solid var(--accent);
  box-shadow:0 0 14px rgba(109,140,255,.4);
}

.card{
  background:
    linear-gradient(145deg,#101a2a,#0c1421);
  border:1px solid var(--line);
  border-radius:15px;
  padding:17px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  border-color:#425b86;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  margin-right:5px;
  border-radius:999px;
  font-size:11px;
  color:#b9c8e6;
  background:#18243a;
  border:1px solid #2b3c5a;
}

.badge.star{
  color:#f0ce7e;
}

.title{
  font-size:19px;
  font-weight:800;
  margin:10px 0 8px;
}

.summary{
  color:#b8c3d6;
  line-height:1.75;
  font-size:14px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px;
}

.tag{
  color:#8190aa;
  font-size:11px;
}

.detail-btn{
  margin-top:14px;
  border:1px solid #314361;
  background:#111d30;
  color:#dce6fb;
  padding:8px 12px;
  border-radius:9px;
}

.detail-btn:hover{
  border-color:var(--accent);
}

.empty{
  display:none;
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  padding:25px 15px;
  overflow:auto;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(8px);
}

.modal.open{
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.modal-box{
  width:min(850px,100%);
  margin:auto;
  background:#0b111d;
  border:1px solid #2a3b58;
  border-radius:18px;
  overflow:hidden;
}

.modal-head{
  padding:20px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.modal-head h2{
  margin:0;
  font-size:23px;
}

.close{
  width:38px;
  height:38px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#111a2a;
  color:#fff;
  font-size:20px;
}

.modal-body{
  padding:22px;
  color:#b9c4d7;
  line-height:1.8;
}

.modal-body h3{
  color:#e5ebf8;
  margin:22px 0 8px;
}

.modal-body p{
  margin:6px 0;
}

@media(max-width:700px){

  main{
    padding:35px 14px 60px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .timeline::before{
    left:9px;
  }

  .event{
    display:block;
    padding-left:32px;
  }

  .year{
    text-align:left;
    padding:0 0 7px;
  }

  .dot{
    left:1px;
    top:3px;
  }

  .header-inner{
    padding:14px;
  }

  .header-sub{
    display:none;
  }
}
</style>
</head>

<header>
  <div class="header-inner">
    <div class="logo">
      日本史 <span>TIMELINE</span>
    </div>
    <div class="header-sub">
      原始から現代まで
    </div>
  </div>
</header>

<main>

<section class="hero">
  <div class="eyebrow">JAPANESE HISTORY</div>

<section class="control-box">

    <select id="importanceFilter">

    </select>

  </div>

  <div class="stats">

    </div>

    <div class="stat">
      全体 <strong id="total">0</strong> 件
    </div>

  </div>

</section>


<div id="timeline" class="timeline"></div>

<div id="empty" class="empty">
  条件に一致する項目がありません。
</div>

</main>


<div id="modal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle"></h2>

      <button
        id="closeModal"
        class="close"
        type="button"
      >
        ×
      </button>

    </div>

    <div
      id="modalBody"
      class="modal-body"
    ></div>

  </div>

</div>

/* =========================================================
   DOM
========================================================= */

const timeline =
  document.getElementById("timeline");

const search =
  document.getElementById("search");

const eraFilter =
  document.getElementById("eraFilter");

const categoryFilter =
  document.getElementById("categoryFilter");

const importanceFilter =
  document.getElementById("importanceFilter");

const count =
  document.getElementById("count");

const total =
  document.getElementById("total");

const empty =
  document.getElementById("empty");

const modal =
  document.getElementById("modal");

const modalTitle =
  document.getElementById("modalTitle");

const modalBody =
  document.getElementById("modalBody");

const closeModal =
  document.getElementById("closeModal");


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   フィルター初期化
========================================================= */

function initFilters(){

  const eras =
    [...new Set(
      timelineData.map(item => item.era)
    )];

  const categories =
    [...new Set(
      timelineData.map(item => item.category)
    )];


  eras.forEach(value => {

    const option =
      document.createElement("option");

    option.value = value;
    option.textContent = value;

    eraFilter.appendChild(option);

  });


  categories.forEach(value => {

    const option =
      document.createElement("option");

    option.value = value;
    option.textContent = value;

    categoryFilter.appendChild(option);

  });


  total.textContent =
    timelineData.length;

}


/* =========================================================
   表示
========================================================= */

function render(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const filtered =
    timelineData.filter(item => {

      const searchable = [

        item.year,
        item.era,
        item.category,
        item.title,
        item.summary,
        item.people,
        item.body,
        item.result,
        ...item.tags

      ]
      .join(" ")
      .toLowerCase();


      const keywordOK =
        !keyword ||
        searchable.includes(keyword);


      const eraOK =
        !eraFilter.value ||
        item.era === eraFilter.value;


      const filtered =
    timelineData
      .filter(item => {

        const searchable = [

          item.year,
          item.era,
          item.category,
          item.title,
          item.summary,
          item.people,
          item.body,
          item.result,
          ...item.tags

        ]
        .join(" ")
        .toLowerCase();


        const keywordOK =
          !keyword ||
          searchable.includes(keyword);


        const eraOK =
          !eraFilter.value ||
          item.era === eraFilter.value;


        const categoryOK =
          !categoryFilter.value ||
          item.category === categoryFilter.value;


        const importanceOK =
          !importanceFilter.value ||
          String(item.importance)
          === importanceFilter.value;


        return (
          keywordOK &&
          eraOK &&
          categoryOK &&
          importanceOK
        );

      })

      // ID順に自動整理
      .sort((a, b) => Number(a.id) - Number(b.id));

  timeline.innerHTML =
    filtered.map(item => {

      const stars =
        "★".repeat(item.importance);


      const tags =
        item.tags
          .map(tag =>
            `<span class="tag">#${escapeHTML(tag)}</span>`
          )
          .join("");


      return `

        <article class="event">

          <div class="year">
            ${escapeHTML(item.year)}
          </div>

          <div class="dot"></div>

          <div class="card">

            <span class="badge">
              ${escapeHTML(item.era)}
            </span>

            <span class="badge">
              ${escapeHTML(item.category)}
            </span>

            <span class="badge star">
              ${stars}
            </span>

            <div class="title">
              ${escapeHTML(item.title)}
            </div>

            <div class="summary">
              ${escapeHTML(item.summary)}
            </div>

            <div class="tags">
              ${tags}
            </div>

            <button
              class="detail-btn"
              data-id="${item.id}"
              type="button"
            >
              詳しく見る
            </button>

          </div>

        </article>

      `;

    })
    .join("");


  count.textContent =
    filtered.length;


  empty.style.display =
    filtered.length === 0
      ? "block"
      : "none";

}


/* =========================================================
   詳細モーダル
========================================================= */

function openModal(id){

  const item =
    timelineData.find(
      value =>
        String(value.id) === String(id)
    );


  if(!item){
    return;
  }


  modalTitle.textContent =
    `${item.year}　${item.title}`;


  modalBody.innerHTML = `

    <p>
      <strong>時代：</strong>
      ${escapeHTML(item.era)}
    </p>

    <p>
      <strong>分野：</strong>
      ${escapeHTML(item.category)}
    </p>

    <p>
      <strong>重要人物：</strong>
      ${escapeHTML(item.people || "—")}
    </p>

    <h3>概要</h3>

    <p>
      ${escapeHTML(item.body)}
    </p>

    <h3>結果・意義</h3>

    <p>
      ${escapeHTML(item.result)}
    </p>

    <h3>キーワード</h3>

    <p>
      ${item.tags
        .map(tag =>
          `#${escapeHTML(tag)}`
        )
        .join("　")}
    </p>

  `;


  modal.classList.add("open");

}


/* =========================================================
   イベント
========================================================= */

search.addEventListener(
  "input",
  render
);

eraFilter.addEventListener(
  "change",
  render
);

categoryFilter.addEventListener(
  "change",
  render
);

importanceFilter.addEventListener(
  "change",
  render
);


timeline.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(".detail-btn");


    if(!button){
      return;
    }


    openModal(
      button.dataset.id
    );

  }
);


closeModal.addEventListener(
  "click",
  () => {
    modal.classList.remove("open");
  }
);


modal.addEventListener(
  "click",
  event => {

    if(event.target === modal){

      modal.classList.remove("open");

    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){

      modal.classList.remove("open");

    }

  }
);


/* =========================================================
   START
========================================================= */

initFilters();

render();
