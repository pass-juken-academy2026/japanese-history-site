<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>日本史 詳細年表</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#070a10;
  --panel:#0d1320;
  --panel2:#111a2a;
  --line:#24324a;
  --text:#eef3ff;
  --muted:#8e9ab0;
  --accent:#6d8cff;
  --gold:#e7bd62;
  --danger:#ff6b7a;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 20% 0%,rgba(75,100,180,.16),transparent 35%),
    radial-gradient(circle at 90% 10%,rgba(210,160,60,.08),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:
    "Noto Sans JP",
    "Yu Gothic",
    system-ui,
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(18px);
  background:rgba(7,10,16,.82);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.header-inner{
  max-width:1400px;
  margin:auto;
  padding:18px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:20px;
  font-weight:800;
  letter-spacing:.04em;
}

.logo span{
  color:var(--gold);
}

.back{
  border:1px solid var(--line);
  background:var(--panel);
  color:#cbd5e8;
  padding:9px 15px;
  border-radius:10px;
}

.back:hover{
  border-color:var(--accent);
}

/* =========================
   HERO
========================= */

.hero{
  max-width:1400px;
  margin:auto;
  padding:55px 24px 25px;
}

.eyebrow{
  color:var(--gold);
  font-size:13px;
  font-weight:700;
  letter-spacing:.14em;
  margin-bottom:12px;
}

h1{
  margin:0;
  font-size:clamp(34px,5vw,58px);
  line-height:1.1;
}

.hero p{
  color:var(--muted);
  line-height:1.8;
  max-width:800px;
  margin:18px 0 0;
}

/* =========================
   CONTROL
========================= */

.controls{
  max-width:1400px;
  margin:0 auto 30px;
  padding:0 24px;
}

.control-box{
  background:linear-gradient(
    145deg,
    rgba(17,26,42,.96),
    rgba(9,14,24,.96)
  );
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.22);
}

.search{
  width:100%;
  padding:15px 17px;
  border-radius:12px;
  border:1px solid var(--line);
  outline:none;
  background:#080d17;
  color:white;
}

.search:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(109,140,255,.12);
}

.filters{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:12px;
}

select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#080d17;
  color:#dce5f8;
  outline:none;
}

.stats{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:14px;
}

.stat{
  padding:8px 12px;
  border-radius:999px;
  background:#101827;
  border:1px solid #1d2a40;
  color:#aeb9cd;
  font-size:13px;
}

.stat strong{
  color:white;
}

/* =========================
   TIMELINE
========================= */

main{
  max-width:1400px;
  margin:auto;
  padding:0 24px 80px;
}

.timeline{
  position:relative;
}

.timeline::before{
  content:"";
  position:absolute;
  left:88px;
  top:0;
  bottom:0;
  width:2px;
  background:linear-gradient(
    to bottom,
    transparent,
    #34496c 5%,
    #34496c 95%,
    transparent
  );
}

.event{
  position:relative;
  display:grid;
  grid-template-columns:150px 1fr;
  gap:25px;
  margin-bottom:18px;
}

.year{
  text-align:right;
  padding-top:20px;
  padding-right:25px;
  color:var(--gold);
  font-size:15px;
  font-weight:800;
}

.dot{
  position:absolute;
  left:80px;
  top:25px;
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--bg);
  border:3px solid var(--accent);
  box-shadow:0 0 15px rgba(109,140,255,.45);
  z-index:2;
}

.card{
  background:
    linear-gradient(
      145deg,
      rgba(16,24,40,.96),
      rgba(10,15,25,.96)
    );
  border:1px solid var(--line);
  border-radius:16px;
  padding:19px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  border-color:#425b86;
  box-shadow:0 15px 40px rgba(0,0,0,.22);
}

.card-top{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  align-items:center;
}

.badge{
  display:inline-flex;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  background:#172238;
  color:#aebde0;
  border:1px solid #263754;
}

.badge.gold{
  color:#f0ce7e;
  border-color:#5e4c27;
  background:#211b0f;
}

.title{
  font-size:20px;
  font-weight:800;
  margin:10px 0 8px;
}

.summary{
  color:#b3bfd2;
  line-height:1.75;
  font-size:14px;
}

.card-bottom{
  margin-top:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.tag{
  color:#8190aa;
  font-size:11px;
}

.detail-btn{
  flex-shrink:0;
  border:1px solid #314361;
  background:#111c2e;
  color:#dce6fb;
  padding:8px 12px;
  border-radius:9px;
}

.detail-btn:hover{
  border-color:var(--accent);
}

/* =========================
   EMPTY
========================= */

.empty{
  display:none;
  text-align:center;
  padding:70px 20px;
  color:var(--muted);
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
  padding:30px 15px;
  overflow:auto;
}

.modal.open{
  display:flex;
  align-items:flex-start;
  justify-content:center;
}

.modal-box{
  width:min(900px,100%);
  margin:auto;
  background:#0b111d;
  border:1px solid #2a3b58;
  border-radius:20px;
  box-shadow:0 30px 100px rgba(0,0,0,.6);
  overflow:hidden;
}

.modal-head{
  padding:22px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.modal-head h2{
  margin:0;
  font-size:25px;
}

.close{
  width:38px;
  height:38px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#111a2a;
  color:white;
  font-size:20px;
}

.modal-body{
  padding:25px;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:25px;
}

.detail-box{
  background:#0f1726;
  border:1px solid #1d2a40;
  border-radius:12px;
  padding:13px;
}

.detail-label{
  color:#74829b;
  font-size:11px;
  margin-bottom:5px;
}

.detail-value{
  color:#edf2ff;
  line-height:1.6;
}

.section{
  margin-top:25px;
}

.section h3{
  margin:0 0 10px;
  font-size:17px;
  color:#dfe8fa;
}

.section-content{
  color:#b6c1d4;
  line-height:1.8;
  white-space:pre-wrap;
}

.list{
  margin:0;
  padding-left:20px;
  color:#b6c1d4;
  line-height:1.8;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){

  .filters{
    grid-template-columns:repeat(2,1fr);
  }

  .timeline::before{
    left:13px;
  }

  .event{
    display:block;
    padding-left:40px;
  }

  .year{
    text-align:left;
    padding:0 0 8px;
  }

  .dot{
    left:4px;
    top:4px;
  }
}

@media(max-width:560px){

  .hero{
    padding-top:35px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  main,
  .controls,
  .hero{
    padding-left:14px;
    padding-right:14px;
  }

  .card-bottom{
    align-items:flex-start;
    flex-direction:column;
  }

  .detail-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      日本史<span>｜詳細年表</span>
    </div>

    <a class="back" href="index.html">
      ← トップへ
    </a>

  </div>
</header>

<section class="hero">

  <div class="eyebrow">
    JAPANESE HISTORY DATABASE
  </div>

  <h1>日本史 詳細年表</h1>

  <p>
    原始から現代までの政治・社会・経済・外交・文化・宗教を、
    年代順に整理。出来事の「前後関係」と「なぜ起きたのか」まで
    つなげて理解するための日本史データベース。
  </p>

</section>

<section class="controls">

  <div class="control-box">

    <input
      id="search"
      class="search"
      type="text"
      placeholder="事件・人物・制度・年・文化などを検索..."
    >

    <div class="filters">

      <select id="eraFilter">
        <option value="">すべての時代</option>
      </select>

      <select id="categoryFilter">
        <option value="">すべての分野</option>
      </select>

      <select id="importanceFilter">
        <option value="">すべての重要度</option>
        <option value="5">最重要</option>
        <option value="4">重要</option>
        <option value="3">標準</option>
        <option value="2">発展</option>
        <option value="1">補足</option>
      </select>

      <select id="orderFilter">
        <option value="asc">古い → 新しい</option>
        <option value="desc">新しい → 古い</option>
      </select>

    </div>

    <div class="stats">

      <div class="stat">
        表示 <strong id="visibleCount">0</strong> 件
      </div>

      <div class="stat">
        全体 <strong id="totalCount">0</strong> 件
      </div>

    </div>

  </div>

</section>

<main>

  <div id="timeline" class="timeline"></div>

  <div id="empty" class="empty">
    条件に一致する出来事がありません。
  </div>

</main>

<div id="modal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle"></h2>

      <button
        id="closeModal"
        class="close"
        type="button"
      >×</button>

    </div>

    <div id="modalBody" class="modal-body"></div>

  </div>

</div>

/* =========================================================
   STATE
========================================================= */

let currentEvents = [...EVENTS];


/* =========================================================
   ELEMENTS
========================================================= */

const timeline = document.getElementById("timeline");
const empty = document.getElementById("empty");

const search = document.getElementById("search");
const eraFilter = document.getElementById("eraFilter");
const categoryFilter = document.getElementById("categoryFilter");
const importanceFilter = document.getElementById("importanceFilter");
const orderFilter = document.getElementById("orderFilter");

const visibleCount = document.getElementById("visibleCount");
const totalCount = document.getElementById("totalCount");

const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const modalBody = document.getElementById("modalBody");
const closeModal = document.getElementById("closeModal");


/* =========================================================
   INIT FILTERS
========================================================= */

function initFilters(){

  const eras = [...new Set(
    EVENTS.map(e => e.era)
  )];

  const categories = [...new Set(
    EVENTS.map(e => e.category)
  )];

  eras.forEach(era => {

    const option = document.createElement("option");

    option.value = era;
    option.textContent = era;

    eraFilter.appendChild(option);

  });

  categories.forEach(category => {

    const option = document.createElement("option");

    option.value = category;
    option.textContent = category;

    categoryFilter.appendChild(option);

  });

  totalCount.textContent = EVENTS.length;

}


/* =========================================================
   SEARCH
========================================================= */

function searchableText(event){

  return JSON.stringify(event)
    .toLowerCase();

}


function applyFilters(){

  const query = search.value
    .trim()
    .toLowerCase();

  const era = eraFilter.value;
  const category = categoryFilter.value;
  const importance = importanceFilter.value;

  currentEvents = EVENTS.filter(event => {

    const matchesSearch =
      !query ||
      searchableText(event).includes(query);

    const matchesEra =
      !era ||
      event.era === era;

    const matchesCategory =
      !category ||
      event.category === category;

    const matchesImportance =
      !importance ||
      String(event.importance) === importance;

    return (
      matchesSearch &&
      matchesEra &&
      matchesCategory &&
      matchesImportance
    );

  });

  sortEvents();

  render();

}


/* =========================================================
   SORT
========================================================= */

function sortEvents(){

  const direction = orderFilter.value;

  currentEvents.sort((a,b) => {

    return direction === "asc"
      ? a.year - b.year
      : b.year - a.year;

  });

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  timeline.innerHTML = "";

  visibleCount.textContent =
    currentEvents.length;

  empty.style.display =
    currentEvents.length
      ? "none"
      : "block";

  currentEvents.forEach(event => {

    const article =
      document.createElement("article");

    article.className = "event";

    const peopleText =
      event.people?.length
        ? event.people.join(" / ")
        : "—";

    article.innerHTML = `

      <div class="year">
        ${escapeHTML(event.yearLabel)}
      </div>

      <div class="dot"></div>

      <div class="card">

        <div class="card-top">

          <span class="badge">
            ${escapeHTML(event.era)}
          </span>

          <span class="badge">
            ${escapeHTML(event.category)}
          </span>

          ${
            event.importance >= 5
              ? `<span class="badge gold">最重要</span>`
              : ""
          }

        </div>

        <div class="title">
          ${escapeHTML(event.title)}
        </div>

        <div class="summary">
          ${escapeHTML(event.summary)}
        </div>

        <div class="card-bottom">

          <div class="tags">

            <span class="tag">
              関係人物：${escapeHTML(peopleText)}
            </span>

          </div>

          <button
            class="detail-btn"
            type="button"
            data-id="${escapeHTML(event.id)}"
          >
            詳細を見る
          </button>

        </div>

      </div>
    `;

    timeline.appendChild(article);

  });

}


/* =========================================================
   MODAL
========================================================= */

      </div>

        ${

    </div>

    <div class="section">

      <h3>関連事項</h3>

      <ul class="list">

        ${
          event.related?.length
            ? event.related.map(
                p => `<li>${escapeHTML(p)}</li>`
              ).join("")
            : "<li>登録なし</li>"
        }

      </ul>

    </div>

    <div class="section">

      <h3>検索タグ</h3>

      <div class="tags">

        ${
          event.tags?.map(
            tag =>
              `<span class="badge">${escapeHTML(tag)}</span>`
          ).join(" ")
          || "—"
        }

      </div>

    </div>

  `;

  modal.classList.add("open");

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   EVENTS
========================================================= */

search.addEventListener(
  "input",
  applyFilters
);

eraFilter.addEventListener(
  "change",
  applyFilters
);

categoryFilter.addEventListener(
  "change",
  applyFilters
);

importanceFilter.addEventListener(
  "change",
  applyFilters
);

orderFilter.addEventListener(
  "change",
  applyFilters
);


timeline.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".detail-btn"
      );

    if(!button) return;

    openModal(
      button.dataset.id
    );

  }
);


closeModal.addEventListener(
  "click",
  () => {
    modal.classList.remove("open");
  }
);


modal.addEventListener(
  "click",
  event => {

    if(event.target === modal){
      modal.classList.remove("open");
    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){
      modal.classList.remove("open");
    }

  }
);


/* =========================================================
   START
========================================================= */

initFilters();
sortEvents();
render();

</script>
