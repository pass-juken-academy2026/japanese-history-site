<section id="history-deep-study" style="max-width:960px;margin:24px auto;padding:24px;border:1px solid #334155;border-radius:16px;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif"><p style="color:#93c5fd;font-weight:700">受験対策・単元別ガイド</p><h2>日本史：流れ・制度・史料の読み方</h2><p>年代だけを暗記するのではなく、「背景→変化→結果」をつないで理解しよう。</p><label for="hist-unit">単元を選ぶ</label><select id="hist-unit" style="display:block;width:100%;padding:10px;margin:8px 0 14px;border-radius:8px"><option value="ancient">古代国家の形成</option><option value="medieval">中世の政治・社会</option><option value="early">近世の統一と幕藩体制</option><option value="modern">近代国家と戦争</option><option value="postwar">戦後日本</option><option value="source">史料・資料読解</option></select><div id="hist-guide" style="padding:16px;background:#172554;border-radius:10px;line-height:1.8" aria-live="polite"></div><hr style="margin:22px 0;border-color:#334155"><h2>確認問題</h2><p id="hist-q"></p><div id="hist-choices" style="display:grid;gap:8px"></div><p id="hist-feedback" aria-live="polite"></p><button id="hist-check" type="button">採点する</button> <button id="hist-next" type="button">次の問題</button><p id="hist-score">正解 0 / 解答 0</p><button id="hist-review" type="button">間違いを復習</button><div id="hist-review-list" style="text-align:left;margin-top:12px;padding:12px;background:#172554;border-radius:10px" aria-live="polite">間違えた問題はここに表示されます。</div></section><script>(()=>{const guides={ancient:"律令国家の形成では、中央集権化の進展と土地・人民支配の仕組みを整理する。制度名は目的とセットで覚え、改革の前後を比較する。",medieval:"武士の成長、荘園・公領、主従関係、幕府と朝廷の関係を相互に結び付ける。政治権力だけでなく、土地支配や地域社会の変化も見る。",early:"統一政権の成立から幕藩体制へ、権力の集中・大名統制・身分や流通の仕組みを順に整理する。政策の目的と影響を区別する。",modern:"明治期の制度改革、産業化、外交・戦争、社会運動を時系列と因果関係で結ぶ。制度の変化が社会に与えた影響にも注目する。",postwar:"占領期の改革、憲法・政治制度、経済復興と高度成長、国際関係の変化を国内外の動きと合わせて整理する。",source:"史料は作成された時代・書き手・目的を確認し、本文に書かれた事実と推測を区別する。統計は単位・対象年・母数を確認して比較する。"};const s=document.getElementById("hist-unit"),g=document.getElementById("hist-guide");function show(){g.textContent=guides[s.value]}s.addEventListener("change",show);show();const qs=[{q:"律令国家の基本的な特徴として適切なのは？",c:["法令や官僚制を通じた中央集権的支配","大名が独立して全国を統治","選挙で天皇を選ぶ制度"],a:0,e:"律令国家は律令を基盤とする官僚制と中央集権的な支配を目指した。"},
{q:"中世の武士の成長を理解する際に重要なのは？",c:["土地支配と主従関係","工場制機械工業だけ","現代の政党政治"],a:0,e:"武士の成長には土地支配や主従関係が深く関わる。"},
{q:"幕藩体制の説明として最も適切なのは？",c:["幕府と藩を中心に構成された支配体制","全国の藩が完全に独立した国家","近代の議院内閣制"],a:0,e:"幕府が全国支配の中心となり、各藩の大名を統制する体制。"},
{q:"日本史の史料を読む際、まず確認したいことは？",c:["作成時代・書き手・目的","紙の色だけ","現代の価値観だけ"],a:0,e:"史料の成立背景と立場を確認し、記述の意味や限界を考える。"},
{q:"近代化を考える際に適切な学習方法は？",c:["制度改革と社会への影響をつなげる","改革名だけを孤立して暗記する","年代を一切確認しない"],a:0,e:"改革の背景・内容・影響をつなげると歴史的変化を理解しやすい。"},
{q:"戦後史を学ぶ際に国内政治と合わせて見るべきものは？",c:["国際関係や経済の変化","古代の神話だけ","資料の装飾"],a:0,e:"戦後日本は国際秩序や経済変化と相互に影響し合っている。"}];let pool=[],cur=null,pick=null,done=false,ok=0,n=0,missed=new Map();const q=document.getElementById("hist-q"),c=document.getElementById("hist-choices"),fb=document.getElementById("hist-feedback"),score=document.getElementById("hist-score");function next(){if(!pool.length)pool=qs.slice().sort(()=>Math.random()-.5);cur=pool.pop();pick=null;done=false;q.textContent=cur.q;c.innerHTML="";cur.c.forEach((v,i)=>{const b=document.createElement("button");b.type="button";b.textContent=String.fromCharCode(65+i)+". "+v;b.style.cssText="padding:10px;text-align:left;border-radius:8px;border:1px solid #475569;background:#1e293b;color:#e2e8f0";b.onclick=()=>{if(done)return;pick=i;[...c.children].forEach((x,j)=>x.style.outline=i===j?"2px solid #60a5fa":"" )};c.appendChild(b)});fb.textContent="選択肢を選んで採点しよう。"}document.getElementById("hist-check").onclick=()=>{if(done||pick===null){if(pick===null)fb.textContent="先に選択肢を選んでね。";return}done=true;n++;if(pick===cur.a){ok++;missed.delete(cur.q)}else{missed.set(cur.q,cur)}document.getElementById("hist-review-list").innerHTML=missed.size?"<strong>復習リスト（"+missed.size+"問）</strong><ol>"+Array.from(missed.keys()).map(x=>"<li>"+x+"</li>").join("")+"</ol>":"間違えた問題はまだありません。";fb.textContent=(pick===cur.a?"正解！ ":"不正解。 ")+cur.e;score.textContent="正解 "+ok+" / 解答 "+n+"（正答率 "+Math.round(ok/n*100)+"%）"};document.getElementById("hist-next").onclick=next;document.getElementById("hist-review").onclick=()=>{if(!missed.size){document.getElementById("hist-review-list").textContent="復習する問題はありません。まずは問題に挑戦しよう！";return}pool.push(...Array.from(missed.values()).reverse());next();fb.textContent="復習モード：間違えた問題にもう一度挑戦しよう。"};next()})();</script>
