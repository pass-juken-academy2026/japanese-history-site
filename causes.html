<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本史 CAUSES</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#080b12;
  --panel:#101621;
  --panel2:#141c29;
  --line:#263246;
  --text:#e8eef7;
  --sub:#91a0b7;
  --cyan:#52e0e0;
  --blue:#5ca8ff;
  --purple:#a982ff;
  --green:#62df9b;
  --orange:#ffb45c;
  --red:#ff6f7d;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 15% 0%,
      rgba(82,224,224,.08),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 10%,
      rgba(169,130,255,.08),
      transparent 30%
    ),
    var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;
}

button,
select{
  font:inherit;
}


/* =========================
   HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:50;
  backdrop-filter:blur(16px);
  background:rgba(8,11,18,.88);
  border-bottom:1px solid var(--line);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:18px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:.08em;
  color:var(--cyan);
}

.logo span{
  color:#fff;
}

.nav{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.nav a{
  color:var(--sub);
  text-decoration:none;
  padding:8px 11px;
  border-radius:8px;
  transition:.2s;
}

.nav a:hover{
  color:#fff;
  background:var(--panel2);
}

.nav a.active{
  color:var(--cyan);
  background:rgba(82,224,224,.1);
}


/* =========================
   HERO
========================= */

.hero{
  max-width:1050px;
  margin:auto;
  padding:55px 24px 35px;
  text-align:center;
}

.eyebrow{
  color:var(--cyan);
  font-size:13px;
  font-weight:900;
  letter-spacing:.16em;
  margin-bottom:12px;
}

h1{
  font-size:clamp(34px,6vw,58px);
  line-height:1.1;
  margin-bottom:16px;
}

.hero p{
  color:var(--sub);
  line-height:1.9;
}


/* =========================
   FILTER
========================= */

.controls{
  max-width:1050px;
  margin:auto;
  padding:0 24px 25px;
}

.control-box{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
}

.control-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

select{
  width:100%;
  padding:13px 14px;
  color:#fff;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:9px;
  outline:none;
}

select:focus{
  border-color:var(--cyan);
}


/* =========================
   STATS
========================= */

.stats{
  max-width:1050px;
  margin:auto;
  padding:0 24px 25px;

  display:grid;
  grid-template-columns:
    repeat(3,1fr);

  gap:10px;
}

.stat{
  padding:15px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
}

.stat strong{
  display:block;
  color:var(--cyan);
  font-size:22px;
  margin-bottom:4px;
}

.stat span{
  color:var(--sub);
  font-size:11px;
}


/* =========================
   MAIN
========================= */

.main{
  max-width:1050px;
  margin:auto;
  padding:0 24px 70px;
}


/* =========================
   CAUSE CARD
========================= */

.causes{
  display:grid;
  gap:16px;
}

.cause-card{
  position:relative;
  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.025),
      transparent
    ),
    var(--panel);

  border:1px solid var(--line);
  border-radius:16px;

  transition:
    transform .2s,
    border-color .2s;
}

.cause-card:hover{
  transform:translateY(-2px);
  border-color:#3a4b65;
}

.cause-top{
  padding:23px 25px 18px;
}

.cause-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:14px;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.025);
  color:var(--sub);
  font-size:11px;
}

.badge.period{
  color:var(--blue);
  border-color:rgba(92,168,255,.3);
}

.badge.category{
  color:var(--cyan);
  border-color:rgba(82,224,224,.3);
}

.cause-title{
  font-size:23px;
  font-weight:900;
  line-height:1.5;
}


/* =========================
   FLOW
========================= */

.flow{
  display:grid;
  grid-template-columns:
    1fr
    auto
    1fr
    auto
    1fr;

  align-items:stretch;

  gap:10px;

  padding:0 25px 22px;
}

.flow-box{
  min-height:145px;

  padding:18px;

  border-radius:11px;

  background:var(--panel2);
  border:1px solid var(--line);
}

.flow-label{
  font-size:11px;
  font-weight:900;
  letter-spacing:.1em;
  margin-bottom:9px;
}

.flow-box.cause .flow-label{
  color:var(--orange);
}

.flow-box.event .flow-label{
  color:var(--cyan);
}

.flow-box.result .flow-label{
  color:var(--green);
}

.flow-text{
  color:#d3dce9;
  line-height:1.75;
  font-size:14px;
}

.arrow{
  align-self:center;
  color:#53647d;
  font-size:23px;
  font-weight:900;
}


/* =========================
   DETAILS
========================= */

.detail{
  border-top:1px solid var(--line);
  padding:18px 25px 23px;
  background:rgba(0,0,0,.12);
}

.detail-title{
  color:var(--purple);
  font-size:12px;
  font-weight:900;
  letter-spacing:.1em;
  margin-bottom:8px;
}

.detail-text{
  color:var(--sub);
  line-height:1.85;
  font-size:13px;
}


/* =========================
   TAGS
========================= */

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  padding:0 25px 22px;
}

.tag{
  padding:5px 8px;
  border-radius:6px;
  color:#8998ad;
  background:#0c111a;
  border:1px solid #1d2839;
  font-size:11px;
}


/* =========================
   EMPTY
========================= */

.empty{
  display:none;
  padding:60px 20px;
  text-align:center;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
}

.empty.show{
  display:block;
}

.empty strong{
  display:block;
  margin-bottom:8px;
  font-size:20px;
}

.empty span{
  color:var(--sub);
}


/* =========================
   FOOTER
========================= */

.footer{
  border-top:1px solid var(--line);
  color:var(--sub);
  text-align:center;
  padding:30px 20px;
  font-size:12px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .header-inner{
    flex-direction:column;
    align-items:flex-start;
  }

  .hero{
    text-align:left;
  }

  .control-row{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .flow{
    grid-template-columns:1fr;
  }

  .arrow{
    transform:rotate(90deg);
    text-align:center;
  }

}

@media(max-width:550px){

  .hero,
  .controls,
  .stats,
  .main{
    padding-left:15px;
    padding-right:15px;
  }

  .cause-top{
    padding:20px 18px 15px;
  }

  .cause-title{
    font-size:20px;
  }

  .flow{
    padding:0 18px 18px;
  }

  .detail{
    padding:17px 18px 20px;
  }

  .tags{
    padding:0 18px 18px;
  }

}
</style>
</head>

/* =========================================================
   FILTER INITIALIZE
========================================================= */

function initFilters(){

  const periodFilter =
    document.getElementById("periodFilter");

  const categoryFilter =
    document.getElementById("categoryFilter");


  const periods =
    [...new Set(
      causesData.map(item => item.period)
    )];


  const categories =
    [...new Set(
      causesData.map(item => item.category)
    )];


  periods.forEach(period => {

    const option =
      document.createElement("option");

    option.value = period;
    option.textContent = period;

    periodFilter.appendChild(option);

  });


  categories.forEach(category => {

    const option =
      document.createElement("option");

    option.value = category;
    option.textContent = category;

    categoryFilter.appendChild(option);

  });

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const period =
    document.getElementById("periodFilter").value;

  const category =
    document.getElementById("categoryFilter").value;


  const filtered =
    causesData.filter(item => {

      if(
        period &&
        item.period !== period
      ){
        return false;
      }

      if(
        category &&
        item.category !== category
      ){
        return false;
      }

      return true;

    });


  const container =
    document.getElementById("causes");

  container.innerHTML = "";


  document.getElementById("displayCount")
    .textContent = filtered.length;


  document.getElementById("totalCount")
    .textContent = causesData.length;


  const empty =
    document.getElementById("empty");


  if(filtered.length === 0){

    empty.classList.add("show");

    return;

  }


  empty.classList.remove("show");


  filtered.forEach(item => {

    const card =
      document.createElement("article");

    card.className = "cause-card";


    card.innerHTML = `

      <div class="cause-top">

        <div class="cause-meta">

          <span class="badge period">
            ${escapeHTML(item.period)}
          </span>

          <span class="badge category">
            ${escapeHTML(item.category)}
          </span>

        </div>

        <div class="cause-title">
          ${escapeHTML(item.title)}
        </div>

      </div>


      <div class="flow">

        <div class="flow-box cause">

          <div class="flow-label">
            CAUSE / 原因
          </div>

          <div class="flow-text">
            ${escapeHTML(item.cause)}
          </div>

        </div>


        <div class="arrow">
          →
        </div>


        <div class="flow-box event">

          <div class="flow-label">
            EVENT / 出来事
          </div>

          <div class="flow-text">
            ${escapeHTML(item.event)}
          </div>

        </div>


        <div class="arrow">
          →
        </div>


        <div class="flow-box result">

          <div class="flow-label">
            RESULT / 結果
          </div>

          <div class="flow-text">
            ${escapeHTML(item.result)}
          </div>

        </div>

      </div>


      <div class="detail">

        <div class="detail-title">
          POINT
        </div>

        <div class="detail-text">
          ${escapeHTML(item.detail)}
        </div>

      </div>


      <div class="tags">

        ${item.tags.map(tag => `

          <span class="tag">
            #${escapeHTML(tag)}
          </span>

        `).join("")}

      </div>

    `;


    container.appendChild(card);

  });

}
