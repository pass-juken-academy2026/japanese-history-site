<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日本史人物DB | 100人版</title>

<style>
:root{
  --bg:#070b12;
  --panel:#0d1420;
  --panel2:#111b2a;
  --line:#24344b;
  --text:#e8f0fa;
  --muted:#8ea1b8;
  --cyan:#45d9ff;
  --blue:#5c8dff;
  --green:#50e3a4;
  --orange:#ffb45c;
  --red:#ff6b81;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(circle at 20% 0%,rgba(69,217,255,.10),transparent 30%),
    radial-gradient(circle at 90% 10%,rgba(92,141,255,.10),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
}
a{color:inherit;text-decoration:none}
header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(7,11,18,.88);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.nav{
  max-width:1200px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}
.logo{
  font-weight:900;
  letter-spacing:.08em;
  color:var(--cyan);
}
.navlinks{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.navlinks a{
  padding:7px 10px;
  color:var(--muted);
  border-radius:8px;
  font-size:13px;
}
.navlinks a:hover{
  color:var(--text);
  background:var(--panel2);
}
main{
  max-width:1200px;
  margin:auto;
  padding:50px 20px 80px;
}
.hero{
  padding:20px 0 35px;
}
.eyebrow{
  color:var(--cyan);
  font-size:12px;
  font-weight:800;
  letter-spacing:.18em;
}
h1{
  margin:10px 0;
  font-size:clamp(32px,6vw,64px);
  line-height:1;
}
.hero p{
  color:var(--muted);
  max-width:720px;
  line-height:1.8;
}
.controls{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}
input,select{
  width:100%;
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px 14px;
  outline:none;
}
input:focus,select:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 2px rgba(69,217,255,.1);
}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:25px;
}
.stat{
  background:linear-gradient(145deg,var(--panel),#0a111c);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
}
.stat small{
  color:var(--muted);
}
.stat strong{
  display:block;
  font-size:24px;
  margin-top:5px;
  color:var(--cyan);
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
.card{
  background:linear-gradient(145deg,rgba(17,27,42,.98),rgba(10,16,26,.98));
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  cursor:pointer;
  transition:.2s;
  position:relative;
  overflow:hidden;
}
.card:hover{
  transform:translateY(-3px);
  border-color:rgba(69,217,255,.55);
  box-shadow:0 12px 35px rgba(0,0,0,.25);
}
.card::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:2px;
  background:linear-gradient(90deg,var(--cyan),transparent);
}
.badges{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:12px;
}
.badge{
  font-size:11px;
  padding:4px 7px;
  border-radius:999px;
  background:#162337;
  color:#9fb4cd;
  border:1px solid #253a55;
}
.rank{
  color:var(--orange);
}
.card h2{
  margin:0 0 5px;
  font-size:21px;
}
.reading{
  color:var(--muted);
  font-size:12px;
}
.role{
  margin-top:12px;
  color:var(--cyan);
  font-weight:700;
  font-size:13px;
}
.card p{
  color:#aebdce;
  font-size:13px;
  line-height:1.7;
  margin-bottom:0;
}
.empty{
  padding:60px 20px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:15px;
  grid-column:1/-1;
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50;
}
.modal.show{display:flex}
.modal-box{
  width:min(720px,100%);
  max-height:85vh;
  overflow:auto;
  background:#0b121d;
  border:1px solid #30445f;
  border-radius:20px;
  padding:26px;
  box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.close{
  float:right;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:8px;
  width:34px;
  height:34px;
  cursor:pointer;
}
.modal h2{
  margin:10px 0 3px;
  font-size:32px;
}
.modal .reading{
  font-size:14px;
}
.detail{
  margin-top:25px;
  display:grid;
  gap:15px;
}
.detail-box{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:15px;
}
.detail-box strong{
  display:block;
  color:var(--cyan);
  font-size:12px;
  margin-bottom:6px;
}
.detail-box p{
  margin:0;
  line-height:1.8;
  color:#c2cedb;
}
footer{
  text-align:center;
  padding:30px;
  color:#66788f;
  font-size:12px;
}
@media(max-width:850px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .controls{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
  .nav{align-items:flex-start;flex-direction:column}
  .grid{grid-template-columns:1fr}
  .controls{grid-template-columns:1fr}
  main{padding-top:30px}
}
</style>
</head>

</section>

<section id="grid" class="grid"></section>

</main>

<footer>
  JAPANESE HISTORY STUDY PORTAL / PEOPLE DATABASE
</footer>

<div id="modal" class="modal">

        <p id="mExam"></p>

    </div>
  </div>
</div>

/* ======================================================
   DOM
====================================================== */

const grid=document.getElementById("grid");
const search=document.getElementById("search");
const era=document.getElementById("era");
const category=document.getElementById("category");
const importance=document.getElementById("importance");

document.getElementById("total").textContent=peopleData.length;


/* ======================================================
   HTMLエスケープ
====================================================== */

function escapeHTML(str){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* ======================================================
   フィルター
====================================================== */

function getFiltered(){

  const q=search.value.trim().toLowerCase();
  const e=era.value;
  const c=category.value;
  const i=importance.value;

  return peopleData.filter(p=>{

    const text=[
      p.name,
      p.reading,
      p.era,
      p.category,
      p.role,
      p.point,
      p.events,
      p.exam
    ].join(" ").toLowerCase();

    if(q && !text.includes(q)) return false;
    if(e && p.era!==e) return false;
    if(c && p.category!==c) return false;
    if(i && p.importance!==i) return false;

    return true;
  });
}


/* ======================================================
   描画
====================================================== */

function render(){

  const list=getFiltered();

  document.getElementById("shown").textContent=list.length;

  const old=list.filter(p=>p.era==="古代"||p.era==="中世").length;
  const newer=list.filter(p=>p.era==="近世"||p.era==="近代"||p.era==="現代").length;

  document.getElementById("oldCount").textContent=old;
  document.getElementById("newCount").textContent=newer;

  if(!list.length){
    grid.innerHTML='<div class="empty">該当する人物が見つかりません。</div>';
    return;
  }

  grid.innerHTML=list.map(p=>`

    <article class="card" onclick="openModal(${p.id})">

      <div class="badges">
        <span class="badge">${escapeHTML(p.era)}</span>
        <span class="badge">${escapeHTML(p.category)}</span>
        <span class="badge rank">${escapeHTML(p.importance)}</span>
      </div>

      <h2>${escapeHTML(p.name)}</h2>

      <div class="reading">
        ${escapeHTML(p.reading)}
      </div>

      <div class="role">
        ${escapeHTML(p.role)}
      </div>

      <p>
        ${escapeHTML(p.point)}
      </p>

    </article>

  `).join("");
}


/* ======================================================
   モーダル
====================================================== */

function openModal(id){

  const p=peopleData.find(x=>x.id===id);

  if(!p) return;

  document.getElementById("mEra").textContent=p.era;
  document.getElementById("mCategory").textContent=p.category;
  document.getElementById("mImportance").textContent=p.importance+"ランク";

  document.getElementById("mName").textContent=p.name;
  document.getElementById("mReading").textContent=p.reading;
  document.getElementById("mRole").textContent=p.role;
  document.getElementById("mPoint").textContent=p.point;
  document.getElementById("mEvents").textContent=p.events;
  document.getElementById("mExam").textContent=p.exam;

  document.getElementById("modal").classList.add("show");

  document.body.style.overflow="hidden";
}

function closeModal(){

  document.getElementById("modal").classList.remove("show");

  document.body.style.overflow="";
}


/* ======================================================
   イベント
====================================================== */

search.addEventListener("input",render);
era.addEventListener("change",render);
category.addEventListener("change",render);
importance.addEventListener("change",render);

document.getElementById("modal").addEventListener("click",e=>{
  if(e.target.id==="modal") closeModal();
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeModal();
});


/* ======================================================
   初期表示
====================================================== */

render();

</script>
